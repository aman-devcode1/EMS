<header class="navbar">
  <div class="navbar-left">
    <button class="menu-btn" (click)="onMenuClick()" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <span class="navbar-title">EMS System</span>
  </div>

  <div class="navbar-right">
    <!-- Avatar with dropdown -->
    <div class="avatar-wrap">
      <button
        type="button"
        class="avatar-btn"
        [class.active]="profileMenuOpen"
        (click)="toggleProfileMenu($event)"
        aria-label="Profile menu">
        {{ getInitials() }}
      </button>

      <div class="profile-dropdown" *ngIf="profileMenuOpen" (click)="$event.stopPropagation()">
        <a [routerLink]="profileRoute" class="dropdown-item" (click)="closeProfileMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>My Profile</span>
        </a>
      </div>
    </div>

    <button class="signout-btn" (click)="onSignOut()">Sign out</button>
  </div>
</header>
